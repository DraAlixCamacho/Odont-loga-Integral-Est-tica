<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080a">
  <meta name="description" content="Galería de casos clínicos y fotografías de la Dra. Alix Camacho C. en Medellín.">
  <title>Casos clínicos y galería | Dra. Alix Camacho C.</title>
  <style>
    :root{color-scheme:dark;--bg:#07080a;--panel:#12151b;--gold:#dfb747;--text:#f1eee5;--muted:#b7b3a8;--line:rgba(223,183,71,.28)}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 50% 0%,rgba(184,130,25,.16),transparent 38rem),var(--bg);color:var(--text);font:16px/1.6 Montserrat,Arial,sans-serif}
    main{width:min(1120px,calc(100% - 32px));margin:auto;padding:42px 0 64px}
    header{text-align:center;margin-bottom:32px}
    header img{width:72px;height:72px;object-fit:cover;border-radius:50%;border:1px solid rgba(223,183,71,.55)}
    h1{font-family:Georgia,serif;font-weight:500;margin:14px 0 6px;font-size:clamp(2rem,5vw,3rem)}
    h1 span{color:var(--gold)}
    header p{color:var(--muted);margin:0 auto;max-width:620px}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:18px}
    figure{margin:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 12px 30px #0005}
    figure img{display:block;width:100%;height:300px;object-fit:cover;background:#090a0d;transition:transform .3s}
    figure:hover img{transform:scale(1.025)}
    figcaption{padding:13px 15px;color:var(--gold);font-size:.92rem}
    .back{display:inline-block;margin-top:30px;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 18px}
    .back:hover{background:rgba(223,183,71,.1)}
    .note{font-size:.85rem;color:var(--muted);text-align:center;margin:24px auto 0;max-width:760px}
    @media(max-width:480px){figure img{height:240px}}
  </style>
</head>
<body>
  <main>
    <header>
      <img src="logo.jpeg" alt="Logo de la Dra. Alix Camacho">
      <h1>Casos clínicos <span>y galería</span></h1>
      <p>Fotografías disponibles de tratamientos y experiencia clínica. Cada caso requiere una valoración profesional individual.</p>
    </header>
    <section class="gallery" aria-label="Fotografías de casos clínicos y galería">
      <figure><img src="antes de David.jpg" alt="Caso David, antes del tratamiento" loading="lazy"><figcaption>Rehabilitación estética · Caso David · Antes</figcaption></figure>
      <figure><img src="despues de david.jpg" alt="Caso David, después del tratamiento" loading="lazy"><figcaption>Rehabilitación estética · Caso David · Después</figcaption></figure>
      <figure><img src="antes y despues de emanuel.jpg" alt="Caso Emanuel, comparación antes y después" loading="lazy"><figcaption>Aclaramiento · Caso Emanuel · Antes y después</figcaption></figure>
      <figure><img src="1756078664893.jpg" alt="Fotografía de experiencia clínica" loading="lazy"><figcaption>Experiencia clínica</figcaption></figure>
      <figure><img src="crespa.jpg" alt="Retrato de la Dra. Alix Camacho" loading="lazy"><figcaption>Dra. Alix Camacho</figcaption></figure>
      <figure><img src="PARA AFICHES DE LOS ASENSORES (1).png" alt="Pieza gráfica informativa de la clínica" loading="lazy"><figcaption>Información de la clínica</figcaption></figure>
    </section>
    <p class="note">Las fotografías clínicas se comparten con fines informativos; los resultados pueden variar según cada paciente.</p>
    <a class="back" href="index.html">← Volver a la página principal</a>
  </main>
</body>
</html>
